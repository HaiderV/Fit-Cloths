<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fc-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>
    <filter id="fc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF5500" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="#0A0A0C" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />

  <!-- Architectural Anthropometric Grid -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.1" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="4 6" />
  <line x1="256" y1="48" x2="256" y2="464" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.08" stroke-dasharray="5 7" />
  <line x1="48" y1="256" x2="464" y2="256" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.08" stroke-dasharray="5 7" />

  <!-- Tailor Precision Reticle Marks -->
  <path d="M110 150 L110 110 L150 110" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square" fill="none" />
  <path d="M402 150 L402 110 L362 110" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square" fill="none" />
  <path d="M110 362 L110 402 L150 402" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square" fill="none" />
  <path d="M402 362 L402 402 L362 402" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square" fill="none" />

  <!-- Monogram F -->
  <path d="M176 170 L320 170 M176 256 L278 256 M176 170 L176 346" 
        stroke="#FFFFFF" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="miter" 
        fill="none" />

  <!-- Outer Arc C -->
  <path d="M346 210 C346 178 320 162 284 162 M284 350 C332 350 350 322 350 292" 
        stroke="#FFFFFF" 
        stroke-width="22" 
        stroke-linecap="round" 
        fill="none" 
        stroke-opacity="0.88" />

  <!-- AI Golden Ratio Pulse Dot -->
  <circle cx="346" cy="256" r="16" fill="url(#fc-brand-grad)" filter="url(#fc-shadow)" />
  <circle cx="346" cy="256" r="7" fill="#FFFFFF" />
</svg>
