<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF5500" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Container: Dark Minimalist Canvas with Subdued Border -->
  <rect width="512" height="512" rx="112" fill="#0C0C0E" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.08" />

  <!-- Architectural Anthropometric Grid Lines (Subtle) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="6 8" />
  <line x1="256" y1="56" x2="256" y2="456" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="4 6" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="4 6" />

  <!-- Tailor Measuring Compass & Frame Marks -->
  <path d="M120 160 L120 120 L160 120" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square" fill="none" />
  <path d="M392 160 L392 120 L352 120" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square" fill="none" />
  <path d="M120 352 L120 392 L160 392" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square" fill="none" />
  <path d="M392 352 L392 392 L352 392" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square" fill="none" />

  <!-- Central Monogram Emblem: F & C Interlocked Geometric Silhouette -->
  <!-- Letter F -->
  <path d="M184 176 L312 176 M184 256 L276 256 M184 176 L184 340" 
        stroke="#FFFFFF" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="miter" 
        fill="none" />

  <!-- Letter C (Right Arch) -->
  <path d="M340 216 C340 186 316 172 284 172 M284 340 C326 340 344 316 344 286" 
        stroke="#FFFFFF" 
        stroke-width="20" 
        stroke-linecap="round" 
        fill="none" 
        stroke-opacity="0.9" />

  <!-- Tailor Measuring Needle / Reticle Crosshair -->
  <line x1="184" y1="140" x2="184" y2="152" stroke="#FF6B00" stroke-width="5" stroke-linecap="round" />
  <line x1="312" y1="140" x2="312" y2="152" stroke="#FF6B00" stroke-width="5" stroke-linecap="round" />

  <!-- Glowing AI Proportion Calibrator Dot -->
  <circle cx="340" cy="256" r="14" fill="url(#fc-accent)" filter="url(#glow)" />
  <circle cx="340" cy="256" r="6" fill="#FFFFFF" />
</svg>
